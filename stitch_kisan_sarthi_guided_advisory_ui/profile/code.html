<!-- Script to simulate simple interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const logoutBtn = document.querySelector('button.border-error');
            if(logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    // Simulate logout action visual feedback
                    logoutBtn.classList.add('opacity-50', 'pointer-events-none');
                    logoutBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Logging out...';
                    setTimeout(() => {
                        logoutBtn.classList.remove('opacity-50', 'pointer-events-none');
                        logoutBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">logout</span> Logout';
                    }, 1000);
                });
            }
        });
