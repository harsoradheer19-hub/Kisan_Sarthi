<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parameter Summary - Review Answers</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#734e00",
                        "primary-container": "#2e7d32",
                        "outline-variant": "#bfcaba",
                        "on-secondary-container": "#5b675e",
                        "surface-container": "#eeeeee",
                        "on-primary": "#ffffff",
                        "surface-tint": "#1b6d24",
                        "on-tertiary-fixed": "#281900",
                        "tertiary-fixed-dim": "#ffba38",
                        "secondary-fixed-dim": "#bdcabe",
                        "on-surface": "#1a1c1c",
                        "tertiary-container": "#926500",
                        "primary-fixed-dim": "#88d982",
                        "on-secondary-fixed": "#131e17",
                        "on-primary-fixed": "#002204",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9f9",
                        "background": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8e8",
                        "on-error": "#ffffff",
                        "secondary-container": "#d9e6da",
                        "on-secondary-fixed-variant": "#3e4a41",
                        "primary": "#0d631b",
                        "on-background": "#1a1c1c",
                        "secondary-fixed": "#d9e6da",
                        "inverse-primary": "#88d982",
                        "inverse-on-surface": "#f0f1f1",
                        "on-primary-fixed-variant": "#005312",
                        "on-secondary": "#ffffff",
                        "secondary": "#556158",
                        "on-tertiary-fixed-variant": "#604100",
                        "surface-bright": "#f9f9f9",
                        "on-surface-variant": "#40493d",
                        "surface-variant": "#e2e2e2",
                        "surface-container-highest": "#e2e2e2",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a3f69c",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdeac",
                        "inverse-surface": "#2f3131",
                        "outline": "#707a6c",
                        "on-tertiary-container": "#ffefda",
                        "on-primary-container": "#cbffc2",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "12px",
                        "touch-target": "48px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "xs": "8px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- Content Area (Navigation suppressed for transactional screen) -->
<main class="flex-grow flex flex-col px-margin-mobile py-xl w-full max-w-md mx-auto relative z-10 pb-[100px]">
<header class="mb-lg">
<button aria-label="Go back" class="w-touch-target h-touch-target flex items-center justify-center -ml-xs mb-sm text-on-surface-variant hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Review your answers</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Verify the details below before getting advisory.</p>
</header>
<!-- Summary Card -->
<section class="bg-surface-container-lowest rounded-xl shadow-[0_2px_12px_rgba(13,99,27,0.08)] p-md mb-xl border border-surface-variant flex-grow-0">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-md">Advisory Details</h2>
<ul class="space-y-sm">
<!-- Crop -->
<li class="flex items-start bg-surface rounded-lg p-sm border border-surface-variant">
<div class="w-touch-target h-touch-target bg-secondary-container rounded-full flex items-center justify-center text-primary mr-sm flex-shrink-0">
<span class="material-symbols-outlined icon-filled">eco</span>
</div>
<div class="flex flex-col justify-center min-h-[48px]">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Crop</span>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Tomato</span>
</div>
</li>
<!-- Problem -->
<li class="flex items-start bg-surface rounded-lg p-sm border border-surface-variant">
<div class="w-touch-target h-touch-target bg-error-container rounded-full flex items-center justify-center text-error mr-sm flex-shrink-0">
<span class="material-symbols-outlined icon-filled">coronavirus</span>
</div>
<div class="flex flex-col justify-center min-h-[48px]">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Problem</span>
<span class="font-body-lg text-body-lg text-on-surface font-medium">Yellow leaves</span>
</div>
</li>
<!-- Duration -->
<li class="flex items-start bg-surface rounded-lg p-sm border border-surface-variant">
<div class="w-touch-target h-touch-target bg-surface-container-high rounded-full flex items-center justify-center text-on-surface-variant mr-sm flex-shrink-0">
<span class="material-symbols-outlined">schedule</span>
</div>
<div class="flex flex-col justify-center min-h-[48px]">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Duration</span>
<span class="font-body-lg text-body-lg text-on-surface font-medium">4-7 days</span>
</div>
</li>
<!-- Location & Weather Combo -->
<li class="flex flex-col sm:flex-row gap-sm">
<div class="flex-1 flex items-start bg-surface rounded-lg p-sm border border-surface-variant">
<div class="w-10 h-10 bg-tertiary-container rounded-full flex items-center justify-center text-on-tertiary-container mr-sm flex-shrink-0">
<span class="material-symbols-outlined icon-filled">location_on</span>
</div>
<div class="flex flex-col justify-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Location</span>
<span class="font-body-md text-body-md text-on-surface font-medium">Solapur</span>
</div>
</div>
<div class="flex-1 flex items-start bg-surface rounded-lg p-sm border border-surface-variant">
<div class="w-10 h-10 bg-tertiary-fixed rounded-full flex items-center justify-center text-on-tertiary-fixed mr-sm flex-shrink-0">
<span class="material-symbols-outlined icon-filled">partly_cloudy_day</span>
</div>
<div class="flex flex-col justify-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Weather</span>
<span class="font-body-md text-body-md text-on-surface font-medium">28°C, 72% Hum</span>
</div>
</div>
</li>
</ul>
</section>
<!-- Actions -->
<div class="mt-auto flex flex-col gap-sm">
<button class="w-full h-touch-target bg-primary hover:bg-surface-tint text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center shadow-[0_4px_14px_rgba(13,99,27,0.25)] transition-all active:scale-[0.98]">
<span class="material-symbols-outlined mr-xs">psychology</span>
                Get Advisory
            </button>
<button class="w-full h-touch-target bg-transparent border-2 border-outline hover:bg-surface-container text-primary font-label-lg text-label-lg rounded-full flex items-center justify-center transition-colors">
<span class="material-symbols-outlined mr-xs">edit</span>
                Edit Answers
            </button>
</div>
</main>
</body></html>
