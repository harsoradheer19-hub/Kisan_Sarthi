<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Expert Support - Escalation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#734e00",
                        "primary-container": "#2e7d32",
                        "outline-variant": "#bfcaba",
                        "on-secondary-container": "#5b675e",
                        "surface-container": "#eeeeee",
                        "on-primary": "#ffffff",
                        "surface-tint": "#1b6d24",
                        "on-tertiary-fixed": "#281900",
                        "tertiary-fixed-dim": "#ffba38",
                        "secondary-fixed-dim": "#bdcabe",
                        "on-surface": "#1a1c1c",
                        "tertiary-container": "#926500",
                        "primary-fixed-dim": "#88d982",
                        "on-secondary-fixed": "#131e17",
                        "on-primary-fixed": "#002204",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9f9",
                        "background": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8e8",
                        "on-error": "#ffffff",
                        "secondary-container": "#d9e6da",
                        "on-secondary-fixed-variant": "#3e4a41",
                        "primary": "#0d631b",
                        "on-background": "#1a1c1c",
                        "secondary-fixed": "#d9e6da",
                        "inverse-primary": "#88d982",
                        "inverse-on-surface": "#f0f1f1",
                        "on-primary-fixed-variant": "#005312",
                        "on-secondary": "#ffffff",
                        "secondary": "#556158",
                        "on-tertiary-fixed-variant": "#604100",
                        "surface-bright": "#f9f9f9",
                        "on-surface-variant": "#40493d",
                        "surface-variant": "#e2e2e2",
                        "surface-container-highest": "#e2e2e2",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a3f69c",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdeac",
                        "inverse-surface": "#2f3131",
                        "outline": "#707a6c",
                        "on-tertiary-container": "#ffefda",
                        "on-primary-container": "#cbffc2",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "12px",
                        "touch-target": "48px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "xs": "8px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased md:max-w-md md:mx-auto md:shadow-2xl md:relative overflow-x-hidden">
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-touch-target sticky top-0 z-50 bg-surface dark:bg-background">
<button aria-label="Go back" class="w-touch-target h-touch-target flex items-center justify-center -ml-3 text-primary dark:text-primary-fixed transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed truncate flex-1 text-center">Expert Support</h1>
<div class="w-touch-target h-touch-target"></div>
</header>
<!-- Main Content Canvas (Transactional/Escalation so no bottom nav) -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-xl text-center pb-32">
<!-- Visual/Icon Container -->
<div class="relative w-32 h-32 mb-lg bg-surface-container rounded-full flex items-center justify-center shadow-[0_4px_20px_rgba(46,125,50,0.1)]">
<div class="absolute inset-0 bg-primary-container opacity-10 rounded-full animate-pulse"></div>
<span class="material-symbols-outlined text-6xl text-primary" data-icon="support_agent" data-weight="fill">support_agent</span>
</div>
<!-- Copy -->
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">
            We couldn't find a suitable advisory.
        </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto mb-xl">
            Your problem is complex. Would you like an agricultural expert to review it?
        </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm mt-auto md:mt-0">
<button class="w-full h-touch-target bg-primary text-on-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center gap-xs shadow-[0_4px_12px_rgba(13,99,27,0.2)] transition-all duration-200 active:scale-[0.98] active:shadow-sm">
<span class="material-symbols-outlined text-[20px]" data-icon="chat">chat</span>
                Contact Expert
            </button>
<button class="w-full h-touch-target bg-secondary-container text-primary rounded-xl font-label-lg text-label-lg flex items-center justify-center transition-all duration-200 active:scale-[0.98]">
                Try Again
            </button>
</div>
</main>
</body></html>
