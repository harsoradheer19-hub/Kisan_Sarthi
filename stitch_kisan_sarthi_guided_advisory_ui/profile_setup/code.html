    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased overflow-x-hidden">
<!-- Top App Bar (From Shared Components - Simplified for Auth context) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-touch-target sticky top-0 z-50 bg-surface">
<div class="flex items-center gap-xs">
<!-- Placeholder for potential back button or just brand logo in a real app, keeping it clean for auth -->
<span class="material-symbols-outlined text-primary" data-icon="agriculture">agriculture</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Kisan Sarthi</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile py-xl flex flex-col justify-center items-center max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="w-full text-center mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Join Kisan Sarthi</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Help us understand your farming needs.</p>
</div>
<!-- Form Section in a Surface Card -->
<form class="w-full bg-surface-container-lowest p-md rounded-xl shadow-[0_4px_12px_rgba(13,99,27,0.05)] border border-surface-variant flex flex-col gap-lg">
<!-- Full Name Input -->
<div class="flex flex-col gap-base relative group">
<label class="font-label-lg text-label-lg text-on-surface" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant" data-icon="person">person</span>
<input class="w-full pl-touch-target pr-md py-sm rounded-lg border-outline-variant bg-surface-container-low text-on-surface font-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all min-h-[48px]" id="fullName" name="fullName" placeholder="Enter your name" type="text"/>
</div>
</div>
<!-- Mobile Number Input -->
<div class="flex flex-col gap-base relative group">
<label class="font-label-lg text-label-lg text-on-surface" for="mobileNumber">Mobile Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full pl-touch-target pr-md py-sm rounded-lg border-outline-variant bg-surface-container-low text-on-surface font-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all min-h-[48px]" id="mobileNumber" inputmode="numeric" name="mobileNumber" pattern="[0-9]{10}" placeholder="10-digit number" type="tel"/>
</div>
</div>
<!-- Location Input -->
<div class="flex flex-col gap-base relative group">
<label class="font-label-lg text-label-lg text-on-surface" for="location">Location</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant" data-icon="location_on">location_on</span>
<input class="w-full pl-touch-target pr-[60px] py-sm rounded-lg border-outline-variant bg-surface-container-low text-on-surface font-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all min-h-[48px]" id="location" name="location" placeholder="Village or District" type="text"/>
<button aria-label="Detect Location" class="absolute right-sm p-sm rounded-full text-primary hover:bg-primary-container/20 transition-colors flex items-center justify-center h-10 w-10" type="button">
<span class="material-symbols-outlined" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
</div>
<!-- Main Crop Selection (Chips for modern feel instead of standard dropdown, or a stylized select) -->
<div class="flex flex-col gap-base">
<label class="font-label-lg text-label-lg text-on-surface" for="mainCrop">Main Crop</label>
<div class="relative">
<select class="appearance-none w-full px-md py-sm rounded-lg border-outline-variant bg-surface-container-low text-on-surface font-body-md focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all min-h-[48px] pr-touch-target" id="mainCrop" name="mainCrop">
<option disabled="" selected="" value="">Select primary crop</option>
<option value="wheat">Wheat</option>
<option value="rice">Rice (Paddy)</option>
<option value="cotton">Cotton</option>
<option value="sugarcane">Sugarcane</option>
<option value="other">Other</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Spacer -->
<div class="pt-sm"></div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg rounded-full min-h-[48px] flex items-center justify-center gap-xs shadow-md hover:shadow-lg transition-all active:scale-[0.98] active:shadow-sm" type="submit">
<span>Create Profile</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Illustration/Decorative Image -->
<div class="mt-xl w-full max-w-[200px] opacity-80 mix-blend-multiply">
<img class="w-full h-auto object-contain" data-alt="A stylized, modern vector illustration of a healthy, green wheat stalk growing from rich dark soil against a soft, light cream background. The style is flat, minimalist, and uses a warm, agricultural color palette with varied shades of green and earthy tones, perfect for a high-end light-mode farming app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0U7Q8mZWq_TKEiUpjkWS_oXtcb7wc-22mLboVHz4c9hsdWkhqFFeGQdf5_5mgU_7bjPnzHdxfvazOuE2VKh_lLrX0qDQv2VkOfpkLcB358J22bNen4aowesi9VO5DrUNU-X_A-abE9DN7irL_uibtwPpi-3-cSBILV5nquawWMljWVcf7iQAPnaKYSO-XgpYZn8ESvhS2sa05OZbtLnV_gAF5jOUXLb6lgnkHzM2HKk35OhZw2LYS"/>
</div>
</main>
<!-- Suppressed Bottom Navigation for Linear Flow -->
<!-- Nav is hidden as per rules for linear/transactional onboarding pages -->
</body></html>
