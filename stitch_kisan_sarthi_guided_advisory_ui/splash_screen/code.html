<style>
        .loader {
            border: 3px solid theme('colors.secondary-container');
            border-top: 3px solid theme('colors.primary');
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<!-- Main Content -->

<div class="w-64 h-64 mb-xl relative">

</div>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Kisan Sarthi</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant italic">"Har Kisan Ka Smart Saathi"</p>
</div>
</main>
<!-- Footer Area -->
<footer class="w-full px-margin-mobile pb-xl pt-lg flex flex-col items-center space-y-lg fade-in-up" style="animation-delay: 0.2s;">

<div class="flex flex-col items-center space-y-sm">
<div class="loader"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant tracking-wider uppercase">Loading</span>
</div>
<!-- Affiliation -->

<p class="font-label-sm text-label-sm text-outline">Dept of AI &amp; Data Science</p>
