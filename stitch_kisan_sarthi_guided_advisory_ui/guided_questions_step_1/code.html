<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Guided Questions</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#734e00",
                        "primary-container": "#2e7d32",
                        "outline-variant": "#bfcaba",
                        "on-secondary-container": "#5b675e",
                        "surface-container": "#eeeeee",
                        "on-primary": "#ffffff",
                        "surface-tint": "#1b6d24",
                        "on-tertiary-fixed": "#281900",
                        "tertiary-fixed-dim": "#ffba38",
                        "secondary-fixed-dim": "#bdcabe",
                        "on-surface": "#1a1c1c",
                        "tertiary-container": "#926500",
                        "primary-fixed-dim": "#88d982",
                        "on-secondary-fixed": "#131e17",
                        "on-primary-fixed": "#002204",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9f9",
                        "background": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e8e8e8",
                        "on-error": "#ffffff",
                        "secondary-container": "#d9e6da",
                        "on-secondary-fixed-variant": "#3e4a41",
                        "primary": "#0d631b",
                        "on-background": "#1a1c1c",
                        "secondary-fixed": "#d9e6da",
                        "inverse-primary": "#88d982",
                        "inverse-on-surface": "#f0f1f1",
                        "on-primary-fixed-variant": "#005312",
                        "on-secondary": "#ffffff",
                        "secondary": "#556158",
                        "on-tertiary-fixed-variant": "#604100",
                        "surface-bright": "#f9f9f9",
                        "on-surface-variant": "#40493d",
                        "surface-variant": "#e2e2e2",
                        "surface-container-highest": "#e2e2e2",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "primary-fixed": "#a3f69c",
                        "error": "#ba1a1a",
                        "tertiary-fixed": "#ffdeac",
                        "inverse-surface": "#2f3131",
                        "outline": "#707a6c",
                        "on-tertiary-container": "#ffefda",
                        "on-primary-container": "#cbffc2",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "sm": "12px",
                        "touch-target": "48px",
                        "margin-mobile": "16px",
                        "md": "16px",
                        "xs": "8px",
                        "gutter-mobile": "12px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">
<!-- Top App Bar (Simplified for modal/flow) -->
<header class="flex justify-between items-center w-full px-margin-mobile h-touch-target sticky top-0 z-50 bg-surface">
<button aria-label="Close" class="w-touch-target h-touch-target flex items-center justify-center text-on-surface hover:bg-surface-container rounded-full transition-transform duration-200 active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
<span class="font-label-lg text-label-lg text-on-surface-variant">Question 1 of 5</span>
<div class="w-touch-target"></div> <!-- Spacer for centering -->
</header>
<!-- Progress Bar -->
<div class="w-full h-1 bg-surface-container-high px-margin-mobile box-border">
<div class="h-full bg-primary rounded-r-full" style="width: 20%;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile py-xl w-full max-w-md mx-auto relative z-10">
<!-- Question -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-xl text-center md:font-headline-lg md:text-headline-lg">
            Which crop is affected?
        </h1>
<!-- Options Grid -->
<div class="flex flex-col gap-sm flex-1">
<!-- Option 1 -->
<button class="w-full min-h-[64px] bg-surface rounded-xl border-2 border-outline-variant hover:border-primary focus:border-primary focus:bg-secondary-container active:scale-[0.98] transition-all duration-200 flex items-center px-lg shadow-[0_2px_8px_rgba(0,0,0,0.02)] group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary group-focus:text-primary mr-md">nutrition</span>
<span class="font-headline-sm text-headline-sm text-on-surface group-focus:text-primary">Tomato</span>
</button>
<!-- Option 2 (Selected State Example) -->
<button class="w-full min-h-[64px] bg-secondary-container rounded-xl border-2 border-primary active:scale-[0.98] transition-all duration-200 flex items-center px-lg shadow-[0_2px_8px_rgba(0,0,0,0.02)]">
<span class="material-symbols-outlined text-primary mr-md" style="font-variation-settings: 'FILL' 1;">grass</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold">Rice</span>
<span class="material-symbols-outlined text-primary ml-auto" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Option 3 -->
<button class="w-full min-h-[64px] bg-surface rounded-xl border-2 border-outline-variant hover:border-primary focus:border-primary focus:bg-secondary-container active:scale-[0.98] transition-all duration-200 flex items-center px-lg shadow-[0_2px_8px_rgba(0,0,0,0.02)] group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary group-focus:text-primary mr-md">agriculture</span>
<span class="font-headline-sm text-headline-sm text-on-surface group-focus:text-primary">Wheat</span>
</button>
<!-- Option 4 -->
<button class="w-full min-h-[64px] bg-surface rounded-xl border-2 border-outline-variant hover:border-primary focus:border-primary focus:bg-secondary-container active:scale-[0.98] transition-all duration-200 flex items-center px-lg shadow-[0_2px_8px_rgba(0,0,0,0.02)] group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary group-focus:text-primary mr-md">spa</span>
<span class="font-headline-sm text-headline-sm text-on-surface group-focus:text-primary">Cotton</span>
</button>
<!-- Option 5 -->
<button class="w-full min-h-[64px] bg-surface rounded-xl border-2 border-outline-variant hover:border-primary focus:border-primary focus:bg-secondary-container active:scale-[0.98] transition-all duration-200 flex items-center px-lg shadow-[0_2px_8px_rgba(0,0,0,0.02)] group">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary group-focus:text-primary mr-md">more_horiz</span>
<span class="font-headline-sm text-headline-sm text-on-surface group-focus:text-primary">Other</span>
</button>
</div>
</main>
<!-- Bottom Action Area -->
<div class="mt-auto px-margin-mobile py-lg w-full max-w-md mx-auto flex gap-md pb-safe bg-background z-20">
<button class="flex-1 h-touch-target rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg transition-transform duration-200 active:scale-95 shadow-sm">
            Back
        </button>
<button class="flex-[2] h-touch-target rounded-full bg-primary text-on-primary font-label-lg text-label-lg transition-transform duration-200 active:scale-95 shadow-md flex items-center justify-center">
            Next
            <span class="material-symbols-outlined ml-xs text-[18px]">arrow_forward</span>
</button>
</div>
</body></html>
